[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "erp_assistant"
authors = [
    { name = "Codeyard", email = "tech@codeyard.app" }
]
description = "AI Implementation Assistant for this Frappe/ERPNext instance. RAG over the live implementation (custom fields, scripts, workflows, permissions). No model training."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "numpy",
    "requests",
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
